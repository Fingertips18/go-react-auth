name: Client Test

on:
  pull_request:
    branches:
      - develop
    paths:
      - ".github/workflows/client-test.yaml"
      - "client/**"

jobs:
  test:
    name: Run Client Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 18

      - name: Install dependencies
        run: |
          cd client
          npm ci --cache .npm --prefer-offline

      - name: Run vitest
        run: |
          cd client
          npm run test
